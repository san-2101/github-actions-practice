name: CICD


on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "cloing the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build using Docker
        run: echo "Bulding using Docker"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Running the test case
        run: echo "Testing the app"


  deploy: 
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying on the machine
        run: echo  "Deploying the code"
  

name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout/clone the code
        uses: actions/checkout@v7

      - name: Install Linter
        run:  pip install ruff

      - name: check the files for linting
        run: ruff check .

      - name: check the files for linting
        run: ruff check . --fix

name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/clone the code
        uses: actions/checkout@v7
        #by using this command we can copy the code of current branch into the runner

      - name: Install Linter
        run:  pip install ruff
        #by using this command we can install tool

      - name: check the files for linting
        run: ruff check .
        #by using this run the linter tool

      - name: check the files for linting
        run: ruff check . --fix
